<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login · Local Tourism</title>
  <link rel="stylesheet" href="/css/style.css">
  <script>
    (function() {
      var s = localStorage.getItem('lt_theme');
      var t = (s === 'dark' || s === 'light') ? s : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
</head>
<body>
  <header class="site-header"><div class="container">
    <a class="logo" href="/">Local Tourism</a>
    <nav class="nav">
      <a href="/">Home</a><a href="/destinations.html">Destinations</a><a href="/packages.html">Packages</a>
      <a href="/login.html">Login</a><a class="btn btn-primary" href="/register.html">Register</a>
      <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Toggle theme"></button>
    </nav>
  </div></header>

  <main class="section">
    <div class="container">
      <div class="auth-container">
        <div class="auth-card">
          <h2>Welcome Back</h2>
          <p class="subtitle">Log in to manage and view your tourism bookings.</p>

          <div id="auth-alert" class="auth-alert" role="alert"></div>

          <form id="login-form" class="auth-form" novalidate>
            <div class="form-group">
              <label for="email">Email address</label>
              <input type="email" id="email" name="email" class="form-input" required autocomplete="email" autofocus placeholder="you@example.com">
            </div>

            <div class="form-group">
              <label for="password">Password</label>
              <input type="password" id="password" name="password" class="form-input" required autocomplete="current-password" placeholder="••••••••">
            </div>

            <button type="submit" id="submit-btn" class="btn btn-primary auth-btn">Log In</button>
          </form>

          <p class="auth-footer">
            Don't have an account yet? <a href="/register.html">Create an account</a>
          </p>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer"><div class="container"><span class="status" id="health-status">Checking server…</span><p>© Local Tourism Package Booking System</p></div></footer>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
