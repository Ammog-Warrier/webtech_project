<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manage categories · Local Tourism</title>
  <link rel="stylesheet" href="/css/style.css">
  <script>
    (function() {
      var saved = localStorage.getItem('lt_theme');
      var theme = (saved === 'dark' || saved === 'light') ? saved : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</head>
<body>
  <header class="site-header"><div class="container">
    <a class="logo" href="/">Local Tourism</a>
    <nav class="nav">
      <a href="/">Home</a>
      <a href="/destinations.html">Destinations</a>
      <a href="/packages.html">Packages</a>
      <a href="/admin-dashboard.html">Admin</a>
      <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Toggle theme"></button>
    </nav>
  </div></header>

  <main class="section"><div class="container">

    <div class="page-heading">
      <div>
        <p class="eyebrow">Administration</p>
        <h1>Category Management</h1>
        <p>Create and maintain the categories used to classify travel packages.</p>
      </div>
    </div>

    <section class="detail-panel" >
      <h2 id="form-title">Add category</h2>
      <form id="category-form">
        <input type="hidden" id="category-id">
        <div class="form-group">
          <label for="category-name">Name</label>
          <input id="category-name" name="name" maxlength="100" required>
        </div>
        <div class="form-group">
          <label for="category-description">Description</label>
          <textarea id="category-description" name="description" rows="3" maxlength="5000"></textarea>
        </div>
        <div class="button-group">
          <button class="btn btn-primary" type="submit" id="save-button">Save category</button>
          <button class="btn btn-secondary" type="button" id="cancel-edit" hidden>Cancel edit</button>
        </div>
      </form>
      <p id="form-message" role="status" aria-live="polite"></p>
    </section>

    <section>
      <div class="section-heading">
        <h2>Categories</h2>
        <input id="category-search" type="search" placeholder="Search categories..." aria-label="Search categories">
      </div>
      <p id="list-message" role="status" aria-live="polite"></p>
      <div class="table-responsive">
        <table class="data-table">
          <thead>
            <tr><th>Name</th><th>Description</th><th>Packages</th><th>Actions</th></tr>
          </thead>
          <tbody id="category-rows"></tbody>
        </table>
      </div>
    </section>

  </div></main>

  <footer class="site-footer"><div class="container"><span class="status" id="health-status">Checking server…</span><p>© Local Tourism Package Booking System</p></div></footer>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/render.js"></script>
  <script src="/js/admin-categories.js"></script>
</body>
</html>
