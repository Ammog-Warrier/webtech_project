<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manage packages · Local Tourism</title>
  <link rel="stylesheet" href="/css/style.css">
  <script>
    (function() {
      var saved = localStorage.getItem('lt_theme');
      var theme = (saved === 'dark' || saved === 'light') ? saved : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</head>
<body>
  <header class="site-header"><div class="container">
    <a class="logo" href="/">Local Tourism</a>
    <nav class="nav">
      <a href="/">Home</a><a href="/destinations.html">Destinations</a>
      <a href="/packages.html">Packages</a><a href="/provider-dashboard.html">Dashboard</a>
      <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Toggle theme"></button>
    </nav>
  </div></header>

  <main class="section"><div class="container provider-packages-page">
    <div class="provider-dashboard-heading">
      <div><p class="eyebrow">PROVIDER PORTAL</p><h1>Manage packages</h1>
        <p class="muted">Create and maintain your own tour packages. New and edited packages are sent for admin approval.</p></div>
      <button type="button" class="btn btn-primary" id="new-package-btn">Create package</button>
    </div>

    <p id="provider-packages-alert" class="auth-alert" role="alert" aria-live="polite"></p>

    <section id="package-editor" class="profile-card" hidden>
      <h2 id="package-editor-title">Create package</h2>
      <form id="provider-package-form">
        <div class="form-grid">
          <label>Package title<input name="title" required minlength="3" maxlength="150"></label>
          <label>Destination<select name="destination_id" required><option value="">Choose destination</option></select></label>
          <label>Category<select name="category_id"><option value="">Uncategorized</option></select></label>
          <label>Price (INR)<input name="price" type="number" min="0.01" step="0.01" required></label>
          <label>Duration (days)<input name="duration_days" type="number" min="1" max="255" required></label>
          <label>Maximum group size<input name="max_group_size" type="number" min="1" max="65535" value="12" required></label>
          <label class="form-grid-full">Image URL or local path<input name="image_url" required maxlength="255" placeholder="/assets/img/mountains.jpg"></label>
          <label class="form-grid-full">Description<textarea name="description" rows="4" required maxlength="10000"></textarea></label>
          <label>Itinerary <span class="muted">(one item per line)</span><textarea name="itinerary" rows="5"></textarea></label>
          <label>Inclusions <span class="muted">(one item per line)</span><textarea name="inclusions" rows="5"></textarea></label>
        </div>
        <div class="form-actions">
          <button class="btn btn-primary" type="submit" id="save-package-btn">Save package</button>
          <button class="btn btn-secondary" type="button" id="cancel-edit-btn">Cancel</button>
        </div>
      </form>
    </section>

    <section aria-labelledby="my-packages-heading">
      <h2 id="my-packages-heading">Your packages</h2>
      <div id="provider-package-list" class="provider-package-list"><p class="muted">Loading packages…</p></div>
    </section>
  </div></main>
  <footer class="site-footer"><div class="container"><span class="status" id="health-status">Checking server…</span><p>© Local Tourism Package Booking System</p></div></footer>
  <script src="/js/api.js"></script><script src="/js/auth.js"></script><script src="/js/main.js"></script><script src="/js/provider-packages.js"></script>
</body>
</html>
