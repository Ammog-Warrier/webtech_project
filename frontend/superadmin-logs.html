<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>System logs · Local Tourism</title>
  <link rel="stylesheet" href="/css/style.css">
  <script>
    (function() {
      var saved = localStorage.getItem('lt_theme');
      var theme = (saved === 'dark' || saved === 'light') ? saved : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</head>
<body>
  <header class="site-header"><div class="container">
    <a class="logo" href="/">Local Tourism</a>
    <nav class="nav">
      <a href="/">Home</a>
      <a href="/destinations.html">Destinations</a>
      <a href="/packages.html">Packages</a>
      <a href="/admin-dashboard.html">Admin</a>
      <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Toggle theme"></button>
    </nav>
  </div></header>

  <main class="section"><div class="container admin-dashboard">
    <div class="admin-dashboard-heading">
      <div><p class="eyebrow">SUPER ADMIN</p><h1>System logs</h1><p class="muted">Audit trail of admin and super admin actions, newest first.</p></div>
      <a class="btn btn-secondary" href="/admin-dashboard.html">Back to dashboard</a>
    </div>
    <div id="page-status" class="admin-dashboard-status" role="status" aria-live="polite">Loading…</div>
    <p id="page-error" class="auth-alert" role="alert"></p>

    <form class="toolbar" id="filters" aria-label="Log filters">
      <div class="form-group form-group-grow"><label for="search">Search</label><input id="search" type="search" placeholder="Details, actor name or email"></div>
      <div class="form-group"><label for="action">Action</label><input id="action" placeholder="e.g. CATEGORY_CREATED"></div>
      <div class="form-group"><label for="entity">Entity</label><input id="entity" placeholder="e.g. categories"></div>
      <div class="form-group"><label for="from">From</label><input id="from" type="date"></div>
      <div class="form-group"><label for="to">To</label><input id="to" type="date"></div>
      <button type="button" id="refresh" class="btn btn-secondary">Refresh</button>
    </form>
    <div class="table-responsive"><table class="data-table">
      <thead><tr><th>When</th><th>Actor</th><th>Action</th><th>Entity</th><th>Details</th></tr></thead>
      <tbody id="rows"><tr><td colspan="5">Loading…</td></tr></tbody>
    </table></div>
    <div id="pager" class="pager"></div>
  </div></main>

  <footer class="site-footer"><div class="container"><span class="status" id="health-status">Checking server…</span><p>© Local Tourism Package Booking System</p></div></footer>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/render.js"></script>
  <script src="/js/admin-common.js"></script>
  <script src="/js/superadmin-logs.js"></script>
</body>
</html>
