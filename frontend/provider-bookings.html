<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Provider bookings · Local Tourism</title>
  <link rel="stylesheet" href="/css/style.css">
  <script>
    (function() {
      var saved = localStorage.getItem('lt_theme');
      var theme = (saved === 'dark' || saved === 'light') ? saved : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</head>
<body>
  <header class="site-header"><div class="container">
    <a class="logo" href="/">Local Tourism</a>
    <nav class="nav">
      <a href="/">Home</a><a href="/destinations.html">Destinations</a>
      <a href="/packages.html">Packages</a><a href="/provider-dashboard.html">Dashboard</a>
      <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Toggle theme"></button>
    </nav>
  </div></header>

  <main class="section"><div class="container provider-packages-page">
    <div class="provider-dashboard-heading">
      <div><p class="eyebrow">PROVIDER PORTAL</p><h1>Your bookings</h1>
        <p class="muted">Bookings received for packages owned by your provider account.</p></div>
      <a class="btn btn-secondary" href="/provider-dashboard.html">Back to dashboard</a>
    </div>
    <p id="provider-bookings-alert" class="auth-alert" role="alert" aria-live="polite"></p>
    <div class="form-grid">
      <label>Filter by status
        <select id="booking-status-filter">
          <option value="ALL">All bookings</option><option value="PENDING">Pending</option>
          <option value="CONFIRMED">Confirmed</option><option value="COMPLETED">Completed</option>
          <option value="CANCELLED">Cancelled</option>
        </select>
      </label>
    </div>
    <section aria-labelledby="provider-booking-list-title">
      <h2 id="provider-booking-list-title">Booking history</h2>
      <div id="provider-booking-list" class="provider-package-list"><p class="muted">Loading bookings…</p></div>
    </section>
  </div></main>
  <footer class="site-footer"><div class="container"><span class="status" id="health-status">Checking server…</span><p>© Local Tourism Package Booking System</p></div></footer>
  <script src="/js/api.js"></script><script src="/js/auth.js"></script><script src="/js/main.js"></script><script src="/js/provider-bookings.js"></script>
</body>
</html>
